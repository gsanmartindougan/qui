# Lanzar desde Arch dentro de Docker con Ubuntu 18.04 (glibc 2.27) como base.
version: 1

script:
  - |
    apt-get update
    DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
      build-essential ca-certificates curl pkg-config

    if ! command -v cargo >/dev/null 2>&1; then
      curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
        | sh -s -- -y --profile minimal --default-toolchain 1.99.1
    fi
    export PATH="$HOME/.cargo/bin:$PATH"

    cargo build --release --locked

AppDir:
  path: ./AppDir
  app_info:
    id: io.github.gsanmartindougan.qui
    name: Qui
    icon: qui
    version: 0.2.0
    exec: usr/bin/qui
    exec_args: $@
  after_bundle: |
    install -Dm755 target/release/qui "$APPDIR/usr/bin/qui"
    install -Dm644 packaging/qui-icon.png \
      "$APPDIR/usr/share/icons/hicolor/512x512/apps/qui.png"

    mkdir -p "$APPDIR/usr/share/applications"
    cat > "$APPDIR/usr/share/applications/io.github.gsanmartindougan.qui.desktop" <<'DESKTOP'
    [Desktop Entry]
    Version=1.0
    Type=Application
    Name=Qui
    Exec=qui
    Icon=qui
    Categories=Development;Utility;
    Terminal=false
    DESKTOP
  apt:
    arch: [amd64]
    sources:
      - sourceline: 'deb [arch=amd64] http://archive.ubuntu.com/ubuntu/ bionic main universe'
        key_url: 'https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x3B4FE6ACC0B21F32'
      - sourceline: 'deb [arch=amd64] http://archive.ubuntu.com/ubuntu/ bionic-updates main universe'
        key_url: 'https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x3B4FE6ACC0B21F32'
      - sourceline: 'deb [arch=amd64] http://security.ubuntu.com/ubuntu/ bionic-security main universe'
        key_url: 'https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x3B4FE6ACC0B21F32'
    include:
      - libgcc1
      - libvulkan1
      - libwayland-client0
      - libwayland-cursor0
      - libwayland-egl1
      - libx11-6
      - libx11-xcb1
      - libxcb1
      - libxcb-randr0
      - libxcb-render0
      - libxcb-shape0
      - libxcb-xfixes0
      - libxcb-xkb1
      - libxi6
      - libxinerama1
      - libxkbcommon-x11-0
      - libxrandr2
      - libxcursor1
      - libxfixes3
    exclude:
      - libc6
      - libxkbcommon0
      - libegl-mesa0
      - libgl1-mesa-dri
      - mesa-vulkan-drivers
  files:
    exclude:
      - usr/share/doc
      - usr/share/man
      - usr/lib/x86_64-linux-gnu/libxkbcommon.so*
      - usr/lib/x86_64-linux-gnu/libxkbcommon-x11.so*
  test:
    ubuntu-20-04:
      image: ubuntu:20.04
      command: "bash -lc 'apt-get update && apt-get install -y xvfb xkb-data libxkbcommon0 libxkbcommon-x11-0; Xvfb :99 -screen 0 1024x768x24 >/tmp/xvfb.log 2>&1 & xvfb_pid=$!; sleep 1; export DISPLAY=:99 LD_LIBRARY_PATH=/app/usr/lib/x86_64-linux-gnu:/app/lib/x86_64-linux-gnu:/app/opt/libc/lib/x86_64-linux-gnu; timeout 10s /app/usr/bin/qui; code=$?; kill $xvfb_pid; [ \"$code\" -eq 124 ]'"
    fedora-30:
      image: appimagecrafters/tests-env:fedora-30
      command: "bash -lc 'dnf install -y xorg-x11-server-Xvfb xkeyboard-config libxkbcommon libxkbcommon-x11; Xvfb :99 -screen 0 1024x768x24 >/tmp/xvfb.log 2>&1 & xvfb_pid=$!; sleep 1; export DISPLAY=:99 LD_LIBRARY_PATH=/app/usr/lib/x86_64-linux-gnu:/app/lib/x86_64-linux-gnu:/app/opt/libc/lib/x86_64-linux-gnu; timeout 10s /app/usr/bin/qui; code=$?; kill $xvfb_pid; [ \"$code\" -eq 124 ]'"
    debian-stable:
      image: debian:bookworm
      command: "bash -lc 'apt-get update && apt-get install -y xvfb xkb-data libxkbcommon0 libxkbcommon-x11-0; Xvfb :99 -screen 0 1024x768x24 >/tmp/xvfb.log 2>&1 & xvfb_pid=$!; sleep 1; export DISPLAY=:99 LD_LIBRARY_PATH=/app/usr/lib/x86_64-linux-gnu:/app/lib/x86_64-linux-gnu:/app/opt/libc/lib/x86_64-linux-gnu; timeout 10s /app/usr/bin/qui; code=$?; kill $xvfb_pid; [ \"$code\" -eq 124 ]'"
    arch:
      image: archlinux:latest
      command: "bash -lc 'pacman -Sy --noconfirm xorg-server-xvfb xkeyboard-config libxkbcommon libxkbcommon-x11; Xvfb :99 -screen 0 1024x768x24 >/tmp/xvfb.log 2>&1 & xvfb_pid=$!; sleep 1; export DISPLAY=:99 LD_LIBRARY_PATH=/app/usr/lib/x86_64-linux-gnu:/app/lib/x86_64-linux-gnu:/app/opt/libc/lib/x86_64-linux-gnu; timeout 10s /app/usr/bin/qui; code=$?; kill $xvfb_pid; [ \"$code\" -eq 124 ]'"
      env:
        XDG_RUNTIME_DIR: /tmp
        LC_ALL: C.UTF-8

AppImage:
  arch: x86_64
