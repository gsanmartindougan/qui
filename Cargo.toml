[package]
name = "qui"
version = "0.1.0"
edition = "2024"

[dependencies]
iced = { version = "0.14", default-features = false, features = ["tiny-skia", "thread-pool", "x11", "wayland"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = { version = "0.15", default-features = false, features = ["async-std", "xdg-portal"] }
